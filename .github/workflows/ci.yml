name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra dev

      - name: Run linting
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Run formatting check
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Run type checking
        run: uv run --python ${{ matrix.python-version }} mypy asa_api_client tests

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest --cov=asa_api_client --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
